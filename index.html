    <!--
      Brand type. The guide names Caroline Regular (titles), Kalice Italic (secondary) and
      Syne (body); Caroline and Kalice are not web-licensed here, so Italiana and Fraunces

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Italiana&family=Syne:wght@400..800&display=swap"
    />

    />

    <!--
      Local-business structured data. A studio like this lives on local search, so the
      address, hours and phone are worth stating in machine-readable form.

    -->
